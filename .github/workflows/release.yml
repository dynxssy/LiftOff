# Publishes Liftoff.zip as a GitHub Release so downloads are counted.
name: Release
on:
  push:
    branches: [main]
    paths: [Liftoff.zip, .github/workflows/release.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create or update the v1.0.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release upload v1.0.0 Liftoff.zip --clobber
          else
            gh release create v1.0.0 Liftoff.zip --title "Liftoff 1.0" \
              --notes "macOS 14 or later. Unzip, move Liftoff to Applications, then Control-click it and choose Open the first time."
          fi
